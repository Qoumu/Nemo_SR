# Lightweight inference recipe for TitaNet
# The goal is to keep the recognizer accurate enough for shortlists of speakers
# while shrinking the runtime/footprint through pruning + dynamic quantization.
data:
  train_manifest: data/speakers/known/speaker.json
  val_manifest: data/speakers/unknown/speaker.json
  test_manifest: None
  sample_rate: 16000
  batch_size: 16
  num_workers: 16

model:
  pretrained_name: titanet_large
  device: gpu
  precision: float32
  pruned_path: export/titanet_finetuned.nemo
  load_pruned: true

  encoder:
    enabled: true
    # Remove redundant channels from the depth-wise separable blocks.
    prune_amount: 0.5
    method: ln_structured
    prune_pointwise_only: true
    min_channels: 64
    # Only prune weights/channels; do not drop whole Jasper blocks.
    keep_first_n: null
    keep_last_n: null

  decoder:
    # We only need embeddings; drop the massive speaker-classification head.
    keep_classifier: false
    target_num_classes: 2

  quantization:
    enabled: false
    dtype: qint8
    # Modules listed here are matched by torch class names inside TitaNet.
    modules:
      - Linear

  preprocessor:
    # Expose audio preprocessing hyper-parameters so downstream scripts
    # can re-use them when exporting the model.
    sample_rate: 16000
    n_fft: 512
    window_size: 0.02
    window_stride: 0.01
    features: 64
    normalize: true
